<!DOCTYPE html>
<html>
<head>
  <title>Voice Streaming Test</title>
</head>
<body>
  <h1>WebSocket ↔ gRPC Voice Streaming</h1>
  
  <div style="margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;">
    <legend style="font-weight: bold;">Connection Mode:</legend>
    <div>
      <input type="radio" id="mode-websocket" name="connection-mode" value="websocket" checked>
      <label for="mode-websocket">WebSocket (Legacy)</label>
      <br>
      <input type="radio" id="mode-webrtc" name="connection-mode" value="webrtc">
      <label for="mode-webrtc">WebRTC (New)</label>
    </div>
  </div>

  <button id="start">Start Mic</button>
  <button id="stop" disabled>Stop</button>
  <div id="status">Disconnected</div>

  <div style="margin-top: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; max-width: 400px;">
    <div style="margin-bottom: 5px; font-weight: bold;">Microphone Volume:</div>
    <div style="width: 100%; height: 20px; background-color: #f0f0f0; border-radius: 10px; overflow: hidden; border: 1px solid #ddd;">
      <div id="mic-level" style="width: 0%; height: 100%; background-color: #4CAF50; transition: width 0.05s linear;"></div>
    </div>
  </div>

  <script>
    let ws = null;
    let peerConnection = null;
    let audioCtx = null;
    let mediaStream;
    let audioWorkletNode;
    let analyser; // Force audio processing
    let isRecording = false;

    let nextStartTime = 0;
    const PLAYBACK_SAMPLE_RATE = 8000; // Resampled audio from server

    function connectWebRTC() {
        return new Promise((resolve, reject) => {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const token = '3k659sdg98gkn3d9ghhg977';
            const phone = '84987654321';
            const callId = 'call_' + Date.now();
            // Note the path change to /live-call/webrtc/
            const wsUrl = `${protocol}//${host}/live-call/webrtc/${callId}/${phone}?token=${token}`;
            console.log('Connecting to WebRTC Signaling Server:', wsUrl);

            ws = new WebSocket(wsUrl);

            ws.onopen = async () => {
                console.log('✅ WebRTC Signaling Connected');
                document.getElementById('status').textContent = 'Signaling Connected';

                // Send start message to initialize the call (maps to InitialInfo in proto)
                const startMessage = {
                    type: 'start',
                    type_call: 'inbound',
                    url_audio_file: ''
                };
                ws.send(JSON.stringify(startMessage));
                console.log('📤 Sent start message');

                resolve();
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Handle WebRTC signaling messages (type-based)
                    if (data.type === 'connected') {
                        console.log('✅ Connection acknowledged, ID:', data.connection_id);
                        return;
                    }
                    
                    if (data.type === 'ready') {
                        console.log('✅ Call initialized, Call ID:', data.call_id);
                        document.getElementById('status').textContent = 'WebRTC Ready';
                        return;
                    }
                    
                    // Handle gRPC proto messages (same format as WebSocket)
                    if (data.audio_output) {
                        const base64Audio = data.audio_output.audio_content;
                        const binaryString = window.atob(base64Audio);
                        const len = binaryString.length;
                        const bytes = new Uint8Array(len);
                        for (let i = 0; i < len; i++) {
                            bytes[i] = binaryString.charCodeAt(i);
                        }
                        const audioData = bytes.buffer;

                        console.log('✅ Received audio chunk from server:', audioData.byteLength, 'bytes');
                        
                        if (!audioCtx) return;

                        // Convert Int16 PCM to Float32
                        const int16Data = new Int16Array(audioData);
                        const float32Data = new Float32Array(int16Data.length);
                        
                        for (let i = 0; i < int16Data.length; i++) {
                            float32Data[i] = int16Data[i] / 32768.0;
                        }

                        // Create AudioBuffer
                        const audioBuffer = audioCtx.createBuffer(1, float32Data.length, PLAYBACK_SAMPLE_RATE);
                        audioBuffer.getChannelData(0).set(float32Data);

                        // Create Source
                        const source = audioCtx.createBufferSource();
                        source.buffer = audioBuffer;
                        source.connect(audioCtx.destination);

                        // Schedule playback
                        const currentTime = audioCtx.currentTime;
                        if (nextStartTime < currentTime) {
                            nextStartTime = currentTime + 0.05;
                        }
                        
                        source.start(nextStartTime);
                        nextStartTime += audioBuffer.duration;
                    } else if (data.text_output) {
                        console.log('📝 Received text:', data.text_output.text);
                    } else if (data.signal) {
                        console.log('ℹ️ Received signal:', data.signal);
                        
                        if (data.signal.end_call) {
                            console.log('📴 Call ended by server, Call ID:', data.signal.end_call.call_id);
                            if (isRecording) {
                                document.getElementById('stop').click();
                            }
                        } else if (data.signal.transfer_call) {
                            console.log('↪️  Call transfer signal received');
                            const transferInfo = data.signal.transfer_call;
                            console.log('   Target staff:', transferInfo.target_staff);
                            alert('Call is being transferred to: ' + (transferInfo.target_staff?.map(s => s.name).join(', ') || 'available staff'));
                        } else if (data.signal.kill_audio) {
                            console.log('🔇 Kill audio signal for Call ID:', data.signal.kill_audio.call_id);
                        }
                    } else if (data.error) {
                        console.error('❌ Server error:', data.error);
                    } else {
                        console.log('ℹ️ Unknown message:', data);
                    }
                } catch (err) {
                    console.error('Signaling message error:', err);
                }
            };
            
            ws.onclose = () => {
                 console.log('❌ WebRTC Signaling Disconnected');
                 document.getElementById('status').textContent = 'Disconnected';
            };

            ws.onerror = (e) => reject(e);
        });
    }

    function connectWebSocket() {
      return new Promise((resolve, reject) => {
        // Auto-detect protocol (ws or wss) and host based on current page URL
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host; // e.g. localhost:8080 or my-domain.com
        const token = '3k659sdg98gkn3d9ghhg977';
        const phone = '84987654321';
        const callId = 'call_' + Date.now();
        // Construct the WebSocket URL dynamically
        const wsUrl = `${protocol}//${host}/live-call/websocket/${callId}/${phone}?token=${token}`;
        console.log('Connecting to:', wsUrl);

        ws = new WebSocket(wsUrl);
        // ws.binaryType = 'arraybuffer'; // We are using JSON now
        
        ws.onopen = () => {
          console.log('✅ WebSocket Connected');
          document.getElementById('status').textContent = 'Connected';
          
          // Send InitialInfo
          const initialInfo = {
            initial_info: {
              workspace_id: 'workspace_001', // Should match server config or be dynamic
              call_id: callId,
              customer_phone_number: phone,
              type_call: 'inbound',
              hotline: '+84987654321',
              url_audio_file: ""
            }
          };
          console.log('📤 Sending InitialInfo:', initialInfo);
          ws.send(JSON.stringify(initialInfo));

          resolve();
        };
        
        ws.onclose = () => {
          console.log('❌ WebSocket Disconnected');
          document.getElementById('status').textContent = 'Disconnected';
          // Stop recording if connection drops
          if (isRecording) {
             document.getElementById('stop').click();
          }
        };
        
        ws.onerror = (event) => {
          console.error('❌ WebSocket Error:', event);
          reject(new Error('WebSocket connection failed. Please check if the server is running at ' + wsUrl));
        };

        // Receive ServerAudioChunk from gRPC server
        ws.onmessage = async (e) => {
          try {
            const message = JSON.parse(e.data);
            
            if (message.audio_output) {
              const base64Audio = message.audio_output.audio_content;
              // Decode Base64 to ArrayBuffer
              const binaryString = window.atob(base64Audio);
              const len = binaryString.length;
              const bytes = new Uint8Array(len);
              for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
              }
              const audioData = bytes.buffer;

              console.log('✅ Received audio chunk from server:', audioData.byteLength, 'bytes');
              
              if (!audioCtx) return;

              // Convert Int16 PCM to Float32
              const int16Data = new Int16Array(audioData);
              const float32Data = new Float32Array(int16Data.length);
              
              for (let i = 0; i < int16Data.length; i++) {
                // Normalize to [-1.0, 1.0]
                float32Data[i] = int16Data[i] / 32768.0;
              }

              // Create AudioBuffer
              const audioBuffer = audioCtx.createBuffer(1, float32Data.length, PLAYBACK_SAMPLE_RATE);
              audioBuffer.getChannelData(0).set(float32Data);

              // Create Source
              const source = audioCtx.createBufferSource();
              source.buffer = audioBuffer;
              source.connect(audioCtx.destination);

              // Schedule playback
              const currentTime = audioCtx.currentTime;
              if (nextStartTime < currentTime) {
                nextStartTime = currentTime + 0.05;
              }
              
              source.start(nextStartTime);
              nextStartTime += audioBuffer.duration;

            } else if (message.signal) {
              console.log('ℹ️ Received signal:', message.signal);
              if (message.signal.end_call) {
                console.log('📴 Call ended by server. Call ID:', message.signal.end_call.call_id);
                // Stop recording
                isRecording = false;
                document.getElementById('stop').click();
              } else if (message.signal.transfer_call) {
                console.log('↪️  Call transfer signal received');
                const transferInfo = message.signal.transfer_call;
                console.log('   Target staff:', transferInfo.target_staff);
                alert('Call is being transferred to: ' + (transferInfo.target_staff?.map(s => s.name).join(', ') || 'available staff'));
              }
            }
          } catch (err) {
            console.error('Error processing message:', err);
          }
        };
      });
    }

    function visualizeVolume() {
      if (!isRecording || !analyser) return;
      
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      
      // Calculate average volume
      let sum = 0;
      for(let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      const average = sum / dataArray.length;
      
      // Scale for better visibility (0-255 range, but usually lower)
      // Multiply by 3 to make normal speech visible around 50%
      const volume = Math.min(100, average * 3);
      
      const level = document.getElementById('mic-level');
      if (level) {
        level.style.width = volume + '%';
        
        // Change color based on volume
        if (volume > 80) level.style.backgroundColor = '#ff4444'; // Red for clipping/loud
        else if (volume > 50) level.style.backgroundColor = '#ffbb33'; // Yellow for good level
        else level.style.backgroundColor = '#4CAF50'; // Green for low/normal
      }
      
      requestAnimationFrame(visualizeVolume);
    }

    document.getElementById('start').onclick = async () => {
      try {
        const mode = document.querySelector('input[name="connection-mode"]:checked').value;
        const statusEl = document.getElementById('status');
        statusEl.textContent = `Initializing (${mode})...`;
        
        // Initialize audio context
        if (!audioCtx) {
          audioCtx = new AudioContext();
          console.log('🎵 AudioContext created. Sample rate:', audioCtx.sampleRate);
        }
        
        // Request microphone access FIRST (needed for WebRTC too)
        const constraints = {
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: false 
          }
        };
        
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
          const track = mediaStream.getAudioTracks()[0];
          console.log('🎤 Microphone connected:', track.label);
        } catch (err) {
          console.warn('⚠️  Audio constraints not supported, using basic mic:', err.message);
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        // Connect based on mode
        if (mode === 'websocket') {
             await connectWebSocket();
        } else {
             await connectWebRTC();
        }
        
        // Load AudioWorklet module
        await audioCtx.audioWorklet.addModule('audio-processor.js');
        const source = audioCtx.createMediaStreamSource(mediaStream);

        // Create AudioWorklet node
        audioWorkletNode = new AudioWorkletNode(audioCtx, 'audio-capture-processor');
        
        // Receive PCM data from worklet and send to server
        audioWorkletNode.port.onmessage = (e) => {
          if (!isRecording) return;
          
          // Send audio for both modes (WebSocket and WebRTC use the same signaling channel)
          if (ws && ws.readyState === WebSocket.OPEN && e.data.audio && e.data.audio.byteLength > 0) {
            // Convert Float32 to Int16
            const float32Data = new Float32Array(e.data.audio);
            const int16Data = new Int16Array(float32Data.length);
            for (let i = 0; i < float32Data.length; i++) {
                const s = Math.max(-1, Math.min(1, float32Data[i]));
                int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }

            // Convert Int16 buffer to Base64
            let binary = '';
            const bytes = new Uint8Array(int16Data.buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            const base64Audio = window.btoa(binary);

            // Message format depends on mode
            const message = mode === 'webrtc' ? {
                type: 'audio',
                sample_rate: 8000,
                sample_width: 2,
                num_channels: 1,
                duration: int16Data.length / 8000,
                audio_content: base64Audio
            } : {
                play_audio: {
                    sample_rate: 8000,
                    sample_width: 2,
                    num_channels: 1,
                    duration: int16Data.length / 8000,
                    audio_content: base64Audio
                }
            };

            console.log('📤 Sending audio chunk:', int16Data.byteLength, 'bytes', 'mode:', mode);
            ws.send(JSON.stringify(message));
          }
        };
        
        source.connect(audioWorkletNode);
        
        // Create analyser for volume visualization (not connected to speaker)
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256; // Smaller FFT size for faster response
        audioWorkletNode.connect(analyser);
        
        isRecording = true;
        visualizeVolume(); // Start visualization loop

        document.getElementById('start').disabled = true;
        document.getElementById('stop').disabled = false;
        if (mode !== 'webrtc') { 
            // WebRTC connect sets its own status
            document.getElementById('status').textContent = 'Recording';
        }
        console.log('🎤 Recording started');
        
      } catch (err) {
        console.error('❌ Error:', err);
        const msg = err.message || err.toString() || 'Unknown error';
        document.getElementById('status').textContent = 'Error: ' + msg;
        alert('Error: ' + msg);
      }
    };
    
    document.getElementById('stop').onclick = () => {
      isRecording = false;
      
      const mode = document.querySelector('input[name="connection-mode"]:checked').value;
      
      // Send disconnect message to server before closing WebSocket
      if (ws && ws.readyState === WebSocket.OPEN) {
        const disconnectMessage = mode === 'webrtc' ? {
          type: 'disconnect'
        } : {
          disconnect: {}
        };
        console.log('📤 Sending disconnect message');
        ws.send(JSON.stringify(disconnectMessage));
      }
      
      // Reset volume meter
      const level = document.getElementById('mic-level');
      if (level) {
        level.style.width = '0%';
        level.style.backgroundColor = '#4CAF50';
      }
      
      if (audioWorkletNode) {
        audioWorkletNode.disconnect();
        audioWorkletNode = null;
      }
      
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      
      if (ws) {
        ws.close();
        ws = null;
      }
      
      document.getElementById('start').disabled = false;
      document.getElementById('stop').disabled = true;
      document.getElementById('status').textContent = 'Stopped';
      console.log('⏹  Recording stopped');
    };
    
    // Test function: generate and play test tone
    window.testTone = () => {
      try {
        if (!audioCtx) {
          audioCtx = new AudioContext({ sampleRate: 16000 });
        }
        
        console.log('🔊 Playing test tone (440Hz)...');
        
        const sampleRate = audioCtx.sampleRate;
        const frequency = 440;
        const duration = 1;
        const numSamples = sampleRate * duration;
        
        const buffer = audioCtx.createBuffer(1, numSamples, sampleRate);
        const channelData = buffer.getChannelData(0);
        
        for (let i = 0; i < numSamples; i++) {
          channelData[i] = Math.sin(2 * Math.PI * frequency * i / sampleRate) * 0.3;
        }
        
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        
        source.onended = () => {
          console.log('✅ Test tone finished');
        };
        
      } catch (err) {
        console.error('❌ Test tone error:', err);
      }
    };
  </script>
</body>
</html>
